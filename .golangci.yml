version: "2"

linters:
  default: standard
  enable:
    - modernize
    - wsl_v5

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - localmodule
