name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release request
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be run from the default branch ($DEFAULT_BRANCH), not $REF"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must have the form vMAJOR.MINOR.PATCH: $TAG"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi

  test:
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-${{ steps.setup-go.outputs.go-version }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      - run: go vet ./...

  lint:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: golangci-lint-version
        uses: ./.github/actions/tool-version
        with:
          tool: golangci-lint

      - name: Cache Go modules, build outputs, and golangci-lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-${{ steps.setup-go.outputs.go-version }}-golangci-lint-${{ steps.golangci-lint-version.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-${{ steps.setup-go.outputs.go-version }}-golangci-lint-${{ steps.golangci-lint-version.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.golangci-lint-version.outputs.version }}
          skip-cache: true

  release:
    needs:
      - lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Release builds do not restore caches so that artifacts are built from a clean state.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: goreleaser-version
        uses: ./.github/actions/tool-version
        with:
          tool: goreleaser

      - name: Create and push tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v${{ steps.goreleaser-version.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
